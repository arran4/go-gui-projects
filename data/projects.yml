- title_en: native GUI and utility bindings
  title_zh: ''
  items:
  - name: DarwinKit
    link: https://github.com/progrium/darwinkit
    desc_en: '(old name: MacDriver) lets you work with Apple frameworks and build
      native Mac applications using Go.'
    desc_zh: ''
  - name: dlgs
    link: https://github.com/gen2brain/dlgs
    desc_en: is a cross-platform library for displaying dialogs and input boxes.
    desc_zh: 是一个用于显示对话框和输入框的跨平台库。
  - name: gamen
    link: https://github.com/rajveermalviya/gamen
    desc_en: is cross-platform GUI window creation and management library in Go.
    desc_zh: 是 Go 语言跨平台的 GUI 窗口创建和管理库。
  - name: gform
    link: https://github.com/AllenDang/gform
    desc_en: is an easy to use Windows GUI toolkit for Go.
    desc_zh: 是一个易于使用的 Go Windows GUI 工具包。
  - name: winc
    link: https://github.com/tadvi/winc
    desc_en: is a common library for Go GUI apps on Windows (based on gform).
    desc_zh: 是 Windows 上 Go GUI 应用程序的通用库（基于 gform）。
  - name: glfw
    link: https://github.com/go-gl/glfw
    desc_en: is a Go bindings for GLFW 3.
    desc_zh: 是 GLFW 3 的 Go 绑定。
  - name: go-fltk
    link: https://github.com/pwiecz/go-fltk
    desc_en: is a simple wrapper around [FLTK 1.4 library](https://www.fltk.org/),
      which is a lightweight GUI library which allows creating small, self-contained
      and fast gui applications.
    desc_zh: 是一个简单的包装器 [FLTK 1.4 library](https://www.fltk.org/), 它是一个轻量级的 GUI 库，允许创建小型、独立且快速的
      GUI 应用程序。
  - name: go-mobile
    link: https://github.com/golang/mobile
    desc_en: adds support for mobile platforms (Android and iOS) and provides tools
      to build mobile applications. (A [Go bindings for OpenGL ES 2.0 and ES 3.0](https://godoc.org/golang.org/x/mobile/gl)
      is included.)
    desc_zh: 增加了对移动平台（Android 和 iOS）的支持，并提供了构建移动应用程序的工具。(包括[Go bindings for OpenGL
      ES 2.0 and ES 3.0](https://godoc.org/golang.org/x/mobile/gl))
  - name: go-sfml
    link: https://github.com/teh-cmc/go-sfml
    desc_en: is a Go bindings for [SFML](https://www.sfml-dev.org/).
    desc_zh: 是 [SFML](https://www.sfml-dev.org/)的 Go 绑定。
  - name: GoVCL
    link: https://github.com/ying32/govcl
    desc_en: is a native GUI library based on [liblcl](https://github.com/ying32/liblcl).
    desc_zh: 是一个基于 [liblcl](https://github.com/ying32/liblcl)的本机 GUI 库。
  - name: go-gtk
    link: https://github.com/mattn/go-gtk
    desc_en: is a Go binding for GTK2.
    desc_zh: 是 GTK2 的 Go 绑定。
  - name: gotk3
    link: https://github.com/gotk3/gotk3
    desc_en: provides Go bindings for GTK+3 and dependent projects (including [cairo](https://github.com/gotk3/gotk3/tree/master/cairo)).
    desc_zh: 为 GTK+3 和​​相关项目 (包括 [cairo](https://github.com/gotk3/gotk3/tree/master/cairo))
      提供 Go 绑定。
  - name: gobbi
    link: https://github.com/pekim/gobbi
    desc_en: (including [cairo](https://github.com/pekim/gobbi/tree/master/lib/cairo)).
    desc_zh: (包括 [cairo](https://github.com/pekim/gobbi/tree/master/lib/cairo))。
  - name: gotk4
    link: https://github.com/diamondburned/gotk4
    desc_en: is a GTK4 bindings generator for Go.
    desc_zh: 是 Go 的 GTK4 绑定生成器。
  - name: GXUI
    link: https://github.com/google/gxui
    desc_en: is a Go cross platform UI library.
    desc_zh: 是一个 Go 跨平台 UI 库。
  - name: iup-go
    link: https://github.com/gen2brain/iup-go
    desc_en: is a Go bindings for [IUP](https://www.tecgraf.puc-rio.br/iup/).
    desc_zh: 是 [IUP](https://www.tecgraf.puc-rio.br/iup/)的 Go 绑定
  - name: nuxui
    link: https://github.com/nuxui/nuxui
    desc_en: is a cross-platform GUI library to make macOS, window, linux, IOS, android
      applications.
    desc_zh: 是一个跨平台的 GUI 库，用于制作 macOS、window、linux、IOS、android 应用程序。
  - name: miqt
    link: https://github.com/mappu/miqt
    desc_en: is a MIT-licensed Qt bindings for Go.
    desc_zh: ''
  - name: Qamel
    link: https://github.com/go-qamel/qamel
    desc_en: is a simple QML binding for Go (MIT license)
    desc_zh: ''
  - name: qt
    link: https://github.com/therecipe/qt
    desc_en: allows you to write Qt applications entirely in Go and makes deploying
      them later very easy (LGPL license).
    desc_zh: 允许您完全用 Go 编写 Qt 应用程序，并使以后部署它们变得非常容易。
  - name: qt.go
    link: https://github.com/kitech/qt.go
    desc_en: is a Qt5 binding which uses FFI instead of CGO (LGPL license).
    desc_zh: 是 Qt5 绑定，它使用 FFI 而不是 CGO。
  - name: RenderView
    link: https://github.com/TheGrum/renderview
    desc_en: is an easy Go GUI wrapper for interactive manipulation of visual algorithms/backend
      code. Support go-gtk (default), gotk3 and shiny backends.
    desc_zh: 是一个简单的 Go GUI 包装器，用于交互式操作可视化算法/后端代码。支持 go-gtk（默认）、gotk3 和 shiny 后端。
  - name: go-sdl2
    link: https://github.com/veandco/go-sdl2
    desc_en: is SDL2 wrapped for Go users.
    desc_zh: 是专为 Go 用户包装的 SDL2。
  - name: purego-sdl3
    link: https://github.com/JupiterRider/purego-sdl3
    desc_en: is a cgo-free SDL3 binding.
    desc_zh: ''
  - name: shiny
    link: https://github.com/golang/exp/tree/master/shiny
    desc_en: is a Go cross platform UI package.
    desc_zh: 是一个 Go 跨平台 UI 包。
  - name: Spot
    link: https://github.com/roblillack/spot
    desc_en: is a reactive, cross-platform desktop GUI toolkit.
    desc_zh: 是一个反应灵敏的跨平台桌面 GUI 工具包。
  - name: systray
    link: https://github.com/getlantern/systray
    desc_en: is a cross platfrom Go library to place an icon and menu in the notification
      area. Tested on Windows 8, Mac OSX, Ubuntu 14.10 and Debian 7.6.
    desc_zh: 是一个跨平台的 Go 库，用于在通知区域放置图标和菜单。已在 Windows 8、Mac OSX、Ubuntu 14.10 和 Debian
      7.6 上测试。
  - name: gothic
    link: https://github.com/nsf/gothic
    desc_en: is a tcl/tk binding.
    desc_zh: 是 tcl/tk 的 Go 绑定。
  - name: tk9.0
    link: https://gitlab.com/cznic/tk9.0
    desc_en: is a CGo-free (use dynamic lib loading instead), cross platform GUI toolkit
      for Go.
    desc_zh: ''
  - name: trayhost
    link: https://github.com/shurcooL/trayhost
    desc_en: is a cross-platform Go library to place an icon in the host operating
      system's taskbar.
    desc_zh: 是一个跨平台的 Go 库，用于在主机操作系统的任务栏中放置图标。
  - name: ui
    link: https://github.com/andlabs/ui
    desc_en: aims to provide simple GUI software development in Go, based on my c
      lib [libui](https://github.com/andlabs/libui).
    desc_zh: 旨在使用 c 库 [libui](https://github.com/andlabs/libui)，用 Go 提供简单的 GUI 软件开发。
  - name: w32.go
    link: https://gist.github.com/nathan-osman/18c2e227ad00a223b61c0b3c16d452c3
    desc_en: is a simple example on show to create Windows GUI by using the `syscall`
      package.
    desc_zh: 是一个简单的示例，展示了如何使用syscall包创建 Windows GUI。
  - name: Windigo
    link: https://github.com/rodrigocfd/windigo
    desc_en: Win32 API and GUI in idiomatic Go.
    desc_zh: 采用 Go 编写的 Win32 API 和 GUI。
  - name: Walk
    link: https://github.com/lxn/walk
    desc_en: is a "Windows Application Library Kit" for the Go Programming Language.
    desc_zh: 是 Go 编程的“Windows 应用程序库套件”。
  - name: wui
    link: https://github.com/gonutz/wui
    desc_en: is a Windows GUI library that uses [the native Win32 API](https://github.com/gonutz/w32),
      which is forked from [this one](https://github.com/AllenDang/w32).
    desc_zh: 是一个使用 [the native Win32 API](https://github.com/gonutz/w32)的 Windows
      GUI 库, 它是 [this one](https://github.com/AllenDang/w32)分叉而来的.
  - name: XGB
    link: https://github.com/BurntSushi/xgb
    desc_en: is the X Go Binding, which is a low-level API to communicate with the
    desc_zh: 是 X 的 Go 绑定，它是用于与核心 X 协议和许多 X 扩展进行通信的低级 API。
  - name: xgbutil
    link: https://github.com/BurntSushi/xgbutil
    desc_en: is a utility library designed to work with the X Go Binding.
    desc_zh: 是一个旨在与[XGB](https://github.com/BurntSushi/xgb)配合使用的实用程序库。
  - name: zenity
    link: https://github.com/ncruces/zenity
    desc_en: is a cross-platform package providing [Zenity](https://help.gnome.org/users/zenity/stable/)-like
      dialogs.
    desc_zh: 是一个跨平台包，提供类似[Zenity](https://help.gnome.org/users/zenity/stable/)的对话框。
- title_en: HTML based GUI
  title_zh: ''
  items:
  - name: Apptron
    link: https://github.com/tractordev/apptron
    desc_en: gives you webview windows and common platform APIs for your simple scripts,
      homebrew utilities, or full applications.
    desc_zh: ''
  - name: Go-app
    link: https://github.com/maxence-charriere/go-app
    desc_en: is a package for building progressive web apps (PWA) with the Go programming
      language (Golang) and WebAssembly (Wasm).
    desc_zh: 是一个使用 Go 编程语言（Golang）和 WebAssembly（Wasm）构建渐进式 Web 应用程序（PWA）的软件包。
  - name: go-astilectron
    link: https://github.com/asticode/go-astilectron
    desc_en: helps use build cross platform GUI apps with GO and HTML/JS/CSS. It is
      the official GO bindings of astilectron and is powered by Electron.
    desc_zh: 帮助使用 GO 和 HTML/JS/CSS 构建跨平台 GUI 应用程序。它是 astilectron 的官方 GO 绑定，由 Electron
      提供支持。
  - name: go-sciter
    link: https://github.com/sciter-sdk/go-sciter
    desc_en: 'is a Golang bindings of Sciter: the Embeddable HTML/CSS/script engine
      for modern UI development。'
    desc_zh: 是 Sciter 的 Golang 绑定：用于现代 UI 开发的可嵌入 HTML/CSS/脚本引擎。
  - name: gowd
    link: https://github.com/dtylman/gowd
    desc_en: help us build cross platform GUI apps with GO and HTML/JS/CSS (powered
      by nwjs)。
    desc_zh: 帮助我们使用 GO 和 HTML/JS/CSS (由 nwjs 提供支持) 构建跨平台 GUI 应用程序。
  - name: Gowut
    link: https://github.com/icza/gowut
    desc_en: is a Web UI Toolkit written in pure Go. Apps are rendered as HTML pages.
      It doesn't bundle browsers.
    desc_zh: 是一个纯 Go 编写的 Web UI 工具包。应用程序以 HTML 页面的形式呈现。它不捆绑浏览器。
  - name: Lorca
    link: https://github.com/zserge/lorca
    desc_en: is a very small library to build modern HTML5 desktop apps in Go. It
      doesn't bundle Chrome but reuses the installed Chrome on your machine.
    desc_zh: 是一个非常小的库，用于用 Go 构建现代 HTML5 桌面应用。它不捆绑 Chrome，但会重复使用您机器上已安装的 Chrome。
  - name: Muon
    link: https://github.com/ImVexed/muon
    desc_en: is a lightweight alternative to Electron written in Golang, using [Ultralight](https://ultralig.ht/)
      instead of Chromium.
    desc_zh: 是 Electron 的轻量级替代品，用 Golang 编写，使用[Ultralight](https://ultralig.ht/)而不是
      Chromium。
  - name: Qlovaseed
    link: https://github.com/qlova/seed
    desc_en: is a lightweight alternative to Electron written in Golang. Apps are
      rendered as HTML pages. It doesn't bundle browsers.
    desc_zh: 是使用 Golang 编写的 Electron 的轻量级替代品。应用程序以 HTML 页面的形式呈现。它不捆绑浏览器。
  - name: Wails
    link: https://github.com/wailsapp/wails
    desc_en: is a framework for building desktop applications using Go & Web Technologies.
    desc_zh: 是一个使用 Go 和 Web 技术构建桌面应用程序的框架。
  - name: webview
    link: https://github.com/webview/webview
    desc_en: is a tiny cross-platform webview library for C/C++/Golang to build modern
      cross-platform GUIs.
    desc_zh: 是一个小型跨平台 webview 库，用于 C/C++/Golang 构建现代跨平台 GUI。
- title_en: custom GUI
  title_zh: ''
  items:
  - name: Cogent Core
    link: https://github.com/cogentcore/core
    desc_en: is a free and open source framework for building powerful, fast, elegant
      2D and 3D apps that run on macOS, Windows, Linux, iOS, Android, and the web.
    desc_zh: ''
  - name: duit
    link: https://github.com/mjl-/duit
    desc_en: is a pure go, cross-platform, MIT-licensed ui toolkit for developers.
    desc_zh: 是一个纯 go、跨平台、MIT 许可的开发人员 UI 工具包。
  - name: Fyne
    link: https://github.com/fyne-io/fyne
    desc_en: is an easy to use UI toolkit and app API written in Go. We use OpenGL
      (through the go-gl and go-glfw projects) to provide cross platform graphics.
    desc_zh: 是一个用 Go 编写的易于使用的 UI 工具包和应用程序 API。我们使用 OpenGL（通过 go-gl 和 go-glfw 项目）来提供跨平台图形。
  - name: Gio
    link: https://git.sr.ht/~eliasnaur/gio
    desc_en: 'implements portable immediate mode GUI programs in Go. Gio programs
      run on all the major platforms: iOS/tvOS, Android, Linux (Wayland), macOS, Windows
      and browsers (Webassembly/WebGL).'
    desc_zh: 项目包括一个基于 [the Pathfinder project](https://github.com/servo/pathfinder)项目的高效矢量渲染器，该渲染器在
      OpenGL ES 和 Direct3D 11 上实现。
  - name: goey
    link: https://bitbucket.org/rj/goey
    desc_en: provides a declarative, cross-platform GUI for the Go language. The range
      of controls, their supported properties and events, should roughly match what
      is available in HTML. However, properties and events may be limited to support
      portability. Additionally, styling of the controls will be limited, with the
      look of controls matching the native platform.
    desc_zh: 为 Go 语言提供了声明式、跨平台的 GUI。控件的范围及其支持的属性和事件应与 HTML 中提供的大致相同。但是，属性和事件可能会受到限制以支持可移植性。此外，控件的样式将受到限制，控件的外观与本机平台相匹配。
  - name: go-flutter
    link: https://github.com/go-flutter-desktop/go-flutter
    desc_en: is a package that brings Flutter to the desktop.
    desc_zh: 是一个将 Flutter 应用到桌面的包。
  - name: gui
    link: https://github.com/faiface/gui
    desc_en: provides super minimal, rock-solid foundation for concurrent GUI in Go.
    desc_zh: 为 Go 中的并发 GUI 提供了极简、坚如磐石的基础。
  - name: imgui-go
    link: https://github.com/inkyblackness/imgui-go
    desc_en: is a Go wrapper for Dear ImGui.
    desc_zh: 是 Dear ImGui 的 Go 包装器。
  - name: giu
    link: https://github.com/AllenDang/giu
    desc_en: is a GUI framework based on imgui-go. (Another similar one from the same
      auther, [gimu](https://github.com/AllenDang/gimu), but for nucular.)
    desc_zh: 是一个基于 imgui-go 的 GUI 框架。（另一个类似的框架来自同一作者， [gimu](https://github.com/AllenDang/gimu)，但适用于
      nucular。）
  - name: microui-go
    link: https://github.com/zeozeozeo/microui-go
    desc_en: is a Go port of the tiny immediate-mode UI library [microui](https://github.com/rxi/microui).
    desc_zh: ''
  - name: NanoGUI.go
    link: https://github.com/shibukawa/nanogui-go
    desc_en: is a golang port of [NanoGUI](https://github.com/wjakob/nanogui).
    desc_zh: 是 [NanoGUI](https://github.com/wjakob/nanogui) 的 Go 端口
  - name: nk
    link: https://github.com/golang-ui/nuklear
    desc_en: provides Go bindings for nuklear.h.
    desc_zh: 为 nuklear.h 提供 Go 绑定。
  - name: nucular
    link: https://github.com/aarzilli/nucular
    desc_en: ', which uses gio or shiny backend instead of cgo.'
    desc_zh: ，它使用 gio 或 shiny 后端而不是 cgo。
  - name: Unison
    link: https://github.com/richardwilkes/unison
    desc_en: is a unified graphical user experience toolkit for Go desktop applications.
      macOS, Windows, and Linux are supported. Unison is built upon glfw. Unison defines
      its own look and feel for widgets. This was done to provide as much consistency
      as possible between all supported platforms.
    desc_zh: 是用于 Go 桌面应用程序的统一图形用户体验工具包。支持 macOS、Windows 和 Linux。Unison 建立在 glfw 之上。Unison
      为小部件定义了自己的外观和感觉。这样做是为了在所有支持的平台之间提供尽可能高的一致性。
- title_en: 3D graphics and computing API bindings
  title_zh: ''
  items:
  - name: d3d9
    link: https://github.com/gonutz/d3d9
    desc_en: is a pure Go wrapper for Microsoft's Direct3D9 API.
    desc_zh: 是 Microsoft Direct3D9 API 的纯 Go 包装器。
  - name: gl
    link: https://github.com/go-gl/gl
    desc_en: repository holds Go bindings to various OpenGL versions. They are auto-generated
      using Glow.
    desc_zh: 存储库包含 Go 与各种 OpenGL 版本的绑定。它们是使用 Glow 自动生成的。
  - name: GLHF
    link: https://github.com/faiface/glhf
    desc_en: ', a gl3.3 wrapper.'
    desc_zh: ，一个 gl3.3 包装器。
  - name: OpenGL ES 2.0 and ES 3.0 bindings
    link: https://godoc.org/golang.org/x/mobile/gl
    desc_en: from the go-mobile project.
    desc_zh: ''
  - name: android-go
    link: https://github.com/xlab/android-go
    desc_en: project.
    desc_zh: 项目中的 OpenGL ES 实现。
  - name: vulkan
    link: https://github.com/vulkan-go/vulkan
    desc_en: provides Go bindings for Vulkan — a low-overhead, cross-platform 3D graphics
      and compute API.
    desc_zh: 为 Vulkan 提供 Go 绑定——一种低开销、跨平台的 3D 图形和计算 API。
  - name: vkngwrapper
    link: https://github.com/vkngwrapper
    desc_en: ''
    desc_zh: ''
  - name: go-vk
    link: https://github.com/bbredesen/go-vk
    desc_en: ''
    desc_zh: ''
- title_en: 2D vector graphics and computing APIs
  title_zh: ''
  items:
  - name: draw2d
    link: https://github.com/llgcode/draw2d
    desc_en: is a Go 2D vector graphics library with support for multiple outputs
      such as images (draw2d), pdf documents (draw2dpdf), opengl (draw2dgl) and svg
      (draw2dsvg).
    desc_zh: 是一个 Go 2D 矢量图形库，支持多种输出，如图像（draw2d）、pdf 文档（draw2dpdf）、opengl（draw2dgl）和
      svg（draw2dsvg）。
  - name: gg
    link: https://github.com/fogleman/gg
    desc_en: is a library for rendering 2D graphics in pure Go.
    desc_zh: 是一个用 Go 渲染 2D 图形的库。
  - name: Gio
    link: https://git.sr.ht/~eliasnaur/gio
    desc_en: project includes an efficient vector renderer based on [the Pathfinder
      project](https://github.com/servo/pathfinder), implemented on OpenGL ES and
      Direct3D 11.
    desc_zh: 项目包括一个基于 [the Pathfinder project](https://github.com/servo/pathfinder)项目的高效矢量渲染器，该渲染器在
      OpenGL ES 和 Direct3D 11 上实现。
  - name: giocanvas
    link: https://github.com/ajstarks/giocanvas
    desc_en: is a canvas API built on top of Gio.
    desc_zh: is a canvas API built on top of Gio.
  - name: go-cairo
    link: https://github.com/ungerik/go-cairo
    desc_en: is a Go binding for the cairo graphics library.
    desc_zh: 是一个基于 Gio 构建的画布 API。
  - name: the
    link: https://github.com/gotk3/gotk3/tree/master/cairo
    desc_en: '[other](https://github.com/pekim/gobbi/tree/master/lib/cairo) [ones](https://github.com/golang-ui/cairo).'
    desc_zh: '[gobbi](https://github.com/pekim/gobbi/tree/master/lib/cairo) [cairo](https://github.com/golang-ui/cairo).'
  - name: Go canvas
    link: https://github.com/tfriedel6/canvas
    desc_en: is a pure Go library that provides drawing functionality as similar as
      possible to the HTML5 canvas API, implemented on OpenGL backend (and software
      backend).
    desc_zh: 是一个 Go 库，提供与 HTML5 canvas API 尽可能相似的绘图功能，在 OpenGL 后端（和软件后端）上实现。
  - name: go-chart
    link: https://github.com/wcharczuk/go-chart
    desc_en: is a very simple golang native charting library that supports timeseries
      and continuous line charts.
    desc_zh: 是一个非常简单的 golang 原生图表库，支持时间序列和连续折线图。
  - name: gonum/plot
    link: https://github.com/gonum/plot
    desc_en: provides an API for building and drawing plots in Go
    desc_zh: 提供了用 Go 构建和绘制图表的 API
  - name: go-p5
    link: https://github.com/go-p5/p5
    desc_en: is a simple package that provides primitives resembling the ones exposed
      by the [p5/processing](https://p5js.org/) library.
    desc_zh: 是一个简单的包，它提供类似于 [p5/processing](https://p5js.org/) 库公开的原语。
  - name: go-skia
    link: https://github.com/go101/go-skia
    desc_en: is a Go skia binding based on skia C library through cgo.
    desc_zh: 是一个通过 cgo 基于 skia C 库的 Go skia 绑定。
  - name: NanoVGo
